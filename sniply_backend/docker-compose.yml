version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sniply
      POSTGRES_USER: sniply_user
      POSTGRES_PASSWORD: sniply_pass
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  postgres_data:
